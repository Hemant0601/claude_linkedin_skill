[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-linkedin-skill"
version = "2.0.0"
description = "Claude Code skill for LinkedIn - no developer app needed"
requires-python = ">=3.8"
dependencies = [
    "linkedin-api>=2.2.0",
]

[project.scripts]
linkedin = "linkedin_skill.cli:main"
